# ============================================
# StockVision — Docker Compose
# ============================================
# Servicios: db, backend, frontend, nginx
# ============================================

services:

  # --- PostgreSQL ---
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    networks:
      - stockvision_net
    volumes:
      - postgres_data:/var/lib/postgresql/data
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-stockvision}
      POSTGRES_USER: ${POSTGRES_USER:-stockvision_user}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-Admin123}
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-stockvision_user} -d ${POSTGRES_DB:-stockvision}"]
      interval: 5s
      timeout: 5s
      retries: 5

  # --- Django Backend ---
  backend:
    build:
      context: .
      dockerfile: Dockerfile
    restart: unless-stopped
    networks:
      - stockvision_net
    volumes:
      - static_files:/app/staticfiles
      - media_files:/app/media
      - ./media:/app/media  # Montar media local para preservar archivos existentes
    environment:
      - DJANGO_SECRET_KEY=${DJANGO_SECRET_KEY:-django-insecure-dev-key-change-in-production}
      - DJANGO_DEBUG=${DJANGO_DEBUG:-False}
      - DJANGO_ALLOWED_HOSTS=app.stockvision.site,localhost,127.0.0.1
      - POSTGRES_DB=${POSTGRES_DB:-stockvision}
      - POSTGRES_USER=${POSTGRES_USER:-stockvision_user}
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD:-Admin123}
      - POSTGRES_HOST=db
      - POSTGRES_PORT=5432
      - MAILTRAP_API_TOKEN=${MAILTRAP_API_TOKEN:-}
      - DEFAULT_FROM_EMAIL=${DEFAULT_FROM_EMAIL:-Correo StockVision <Correo@stockvision.site>}
      - CORS_ALLOWED_ORIGINS=${CORS_ALLOWED_ORIGINS:-}
    depends_on:
      db:
        condition: service_healthy
    expose:
      - "8000"

  # --- React Frontend ---
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    restart: unless-stopped
    networks:
      - stockvision_net
    expose:
      - "80"
    depends_on:
      - backend

  # --- Nginx Reverse Proxy ---
  nginx:
    image: nginx:alpine
    restart: unless-stopped
    networks:
      - stockvision_net
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.stockvision.rule=Host(`app.stockvision.site`)"
      - "traefik.http.routers.stockvision.entrypoints=web"
      - "traefik.http.services.stockvision.loadbalancer.server.port=80"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/conf.d/default.conf:ro
      - static_files:/app/staticfiles:ro
      - media_files:/app/media:ro
      - ./media:/app/media:ro
    depends_on:
      - backend
      - frontend

  # --- Traefik Reverse Proxy ---
  traefik:
    image: traefik:v2.11
    command:
    - "--api.insecure=true"
    - "--providers.docker=true"
    - "--entrypoints.web.address=:8081"
    ports:
      - "8081:80"
      - "8080:8080"
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock:ro
    networks:
      - stockvision_net
    restart: unless-stopped

volumes:
  postgres_data:
  static_files:
  media_files:
networks:
  stockvision_net:
    driver: bridge
